<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Giữ dáng vé làm nét nhận diện: cột ưu đãi cam, đường răng cưa, phần thông tin
     thoáng. Cột ưu đãi 76px theo spec (72–80px). "FS" đổi thành chữ đọc được. -->
<div style="display:flex; align-items:stretch; border-radius:16px; background:#fff; border:1px solid #EFE7DB; overflow:hidden; font-family:'Be Vietnam Pro', system-ui; color:#2A211B; min-height:120px;">
  <div style="width:76px; background:{{ v.stemBg }}; color:{{ v.stemFg }}; display:flex; align-items:center; justify-content:center; padding:0 6px; border-right:3px dotted {{ v.stemDot }}; flex-shrink:0; text-align:center;"><span style="font:800 {{ v.tagSize }}/1.05 'Bricolage Grotesque'; letter-spacing:-.02em;">{{ v.tag }}</span></div>
  <div style="flex:1; padding:14px 16px; display:flex; flex-direction:column; gap:7px; min-width:0;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;"><span style="font:600 12px/1 'Be Vietnam Pro'; color:#6B6057;">{{ v.san }}</span><span onClick="{{ v.save }}" style="font:600 13px/1 'Be Vietnam Pro'; color:{{ v.ctaFg }}; background:{{ v.ctaBg }}; border:1.5px solid {{ v.ctaBd }}; padding:8px 14px; border-radius:99px; cursor:pointer; white-space:nowrap;">{{ v.cta }}</span></div>
    <span style="font:700 15px/1.3 'Be Vietnam Pro';">{{ v.title }}</span>
    <span style="font:400 12px/1.4 'Be Vietnam Pro'; color:#6B6057;">{{ v.sub }}</span>
    <div style="display:flex; align-items:center; gap:10px; margin-top:auto;"><div style="flex:1; height:6px; border-radius:99px; background:#F1E9DC; overflow:hidden;"><div style="width:{{ v.pctCss }}; height:100%; background:#FF5A1F; border-radius:99px;"></div></div><span style="font:600 12px/1 'Be Vietnam Pro'; color:#6B6057; white-space:nowrap;">{{ v.left }}</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 140}, &quot;v&quot;: {&quot;editor&quot;: null, &quot;default&quot;: {&quot;tag&quot;: &quot;0đ&quot;, &quot;san&quot;: &quot;Shopee&quot;, &quot;title&quot;: &quot;Voucher 0đ — giảm 50K&quot;, &quot;sub&quot;: &quot;Đơn từ 0đ · mở 12:00 hôm nay&quot;, &quot;pctCss&quot;: &quot;38%&quot;, &quot;left&quot;: &quot;Còn 38%&quot;, &quot;cta&quot;: &quot;Lưu ngay&quot;, &quot;tagSize&quot;: &quot;24px&quot;, &quot;ctaBg&quot;: &quot;transparent&quot;, &quot;ctaFg&quot;: &quot;#2A211B&quot;, &quot;ctaBd&quot;: &quot;#2A211B&quot;, &quot;stemBg&quot;: &quot;#FF5A1F&quot;, &quot;stemFg&quot;: &quot;#fff&quot;, &quot;stemDot&quot;: &quot;#fff&quot;}, &quot;tsType&quot;: &quot;{tag:string; san:string; title:string; sub:string; pctCss:string; left:string; cta:string; save?:()=&gt;void}&quot;}}"></script>
</body>
</html>
