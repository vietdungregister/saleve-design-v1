<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Thẻ sản phẩm — thành phần quyết định chất lượng thị giác của cả lưới.
     Quy tắc: một badge giảm giá duy nhất, tên tối đa 2 dòng để hàng giá và hàng
     hoàn tiền thẳng nhau giữa các thẻ, tiền hoàn là THÔNG TIN (nền cam nhạt),
     không phải nút hành động giả kéo ngang chân thẻ. -->
<div onClick="{{ d.open }}" style="display:flex; flex-direction:column; padding:10px; border-radius:18px; background:#fff; border:1px solid #EFE7DB; box-shadow:0 4px 16px rgba(26,23,18,.05); cursor:pointer; font-family:'Be Vietnam Pro', system-ui; color:#2A211B; transition:transform .16s ease, box-shadow .16s ease;" style-hover="transform:translateY(-2px); box-shadow:0 10px 24px rgba(26,23,18,.09);">
  <div style="position:relative; aspect-ratio:1; width:100%; border-radius:12px; overflow:hidden; background:#F1E9DC;">
    <img src="{{ d.src }}" alt="" style="width:100%; height:100%; object-fit:cover; display:block;">
    <span style="position:absolute; top:8px; left:8px; padding:5px 8px; border-radius:99px; background:#2A211B; color:#FFD98F; font:700 11px/1 'Be Vietnam Pro'; letter-spacing:.01em;">{{ d.off }}</span>
  </div>
  <div style="padding:12px 2px 2px; display:flex; flex-direction:column; gap:7px;">
    <span style="font:500 11px/1 'Be Vietnam Pro'; color:#6B6057;">{{ d.san }} · {{ d.sold }}</span>
    <div style="font:600 14px/1.4 'Be Vietnam Pro'; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:39px;">{{ d.name }}</div>
    <div style="display:flex; flex-direction:{{ d.priceDir }}; align-items:{{ d.priceAlign }}; gap:{{ d.priceGap }};"><span style="font:700 18px/1.3 'Bricolage Grotesque'; color:#2A211B; font-variant-numeric:tabular-nums;">{{ d.price }}</span><span style="font:400 12px/1.4 'Be Vietnam Pro'; color:#6B6057; text-decoration:line-through;">{{ d.old }}</span></div>
    <span style="align-self:flex-start; padding:5px 9px; border-radius:8px; background:#FFE1D2; color:#A63310; font:600 13px/1.25 'Be Vietnam Pro'; white-space:nowrap;">Hoàn {{ d.cash }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 240, &quot;height&quot;: 380}, &quot;d&quot;: {&quot;editor&quot;: null, &quot;default&quot;: {&quot;src&quot;: &quot;img/tile-1.jpg&quot;, &quot;san&quot;: &quot;Shopee&quot;, &quot;sold&quot;: &quot;Đã bán 2,3k&quot;, &quot;name&quot;: &quot;Máy hút bụi cầm tay không dây mini 2 trong 1&quot;, &quot;price&quot;: &quot;259.000đ&quot;, &quot;old&quot;: &quot;399.000đ&quot;, &quot;off&quot;: &quot;-35%&quot;, &quot;cash&quot;: &quot;17.600đ&quot;, &quot;priceDir&quot;: &quot;column&quot;, &quot;priceAlign&quot;: &quot;flex-start&quot;, &quot;priceGap&quot;: &quot;2px&quot;}, &quot;tsType&quot;: &quot;{src:string; san:string; sold:string; name:string; price:string; old:string; off:string; cash:string; open?:()=&gt;void}&quot;}}"></script>
</body>
</html>
